[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-sprawl-prediction"
version = "0.1.0"
description = "Probabilistic geospatial forecasting of urban sprawl using Bayesian spatio-temporal machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Urban Sprawl Prediction Contributors" }
]
keywords = ["urban-sprawl", "geospatial", "remote-sensing", "bayesian", "gaussian-process"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS"
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",

  # Data structures
  "xarray>=2024.6.0",
  "pyarrow>=25.0",

  # Geospatial
  "rasterio>=1.3.10",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "earthengine-api>=1.7.35",

  # Configuration
  "PyYAML>=6.0",

  # Machine Learning
  "scikit-learn>=1.4",
  "torch>=2.3",
  "gpytorch>=1.12",

  # Visualization
  "matplotlib>=3.8",
  "seaborn>=0.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.4"
]

notebooks = [
  "jupyter",
  "ipykernel",
]

docs = [
  "mkdocs",
  "mkdocs-material",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
