model: st_svgp
status: first_real_implementation

dataset:
  path: data/final/yaounde_urban_expansion_30m_v2/cell_time_dataset.parquet
  target: target_transition_5y
  forecast_origin: forecast_origin
  target_year: target_year
  cell_id: cell_id
  x_coordinate: x_center_m
  y_coordinate: y_center_m

feature_set: log_distance_growth

# Parametric mean beta_0 + x^T beta.
# Space and time are intentionally absent here and enter g(s,t).
linear_predictors:
  - ndbi_t
  - savi_t
  - log_distance_to_built_m_t
  - built_fraction_11x11_t
  - recent_local_growth_5y_t
  - elevation_m
  - slope_degrees
  - log_population_density_t
  - built_fraction_x_recent_growth_t

time:
  origin_year: 2000
  step_years: 5

rolling_validation:
  folds:
    - train_origins: [2000]
      validation_origin: 2005

    - train_origins: [2000, 2005]
      validation_origin: 2010

    - train_origins: [2000, 2005, 2010]
      validation_origin: 2015

final_fit:
  origins: [2000, 2005, 2010, 2015]

final_test:
  origins: [2020]
  evaluate: false

kernel:
  spatial_family: matern32
  temporal_family: matern32_markov
  spatial_initial_lengthscale_km: 2.0
  temporal_initial_lengthscale_steps: 1.0
  variance: 1.0

inducing:
  spatial_points: 64
  train_locations: false
  kmeans_n_init: 10

inference:
  method: cvi_natural_gradient
  filtering: sequential
  smoothing: rts
  initial_site_precision: 1.0e-3

  # Applied to dense M_s x M_s CVI site blocks.
  natural_gradient_gamma: 0.01
  minimum_gamma: 1.0e-6
  maximum_retries: 8
  minimum_site_eigenvalue: 1.0e-9

  quadrature_degree: 20

training:
  # Total target batch across all training origins. The implementation divides
  # it approximately equally across time and corrects each time contribution
  # by N_t / B_t.
  batch_size: 1024
  iterations: 1000
  final_iterations: 1200
  adam_learning_rate: 0.001
  gradient_clip_norm: 10.0
  log_every: 50
  prediction_batch_size: 8192
  random_state: 20260809

compute:
  # Reference implementation: stable CPU / float64 first.
  device: cpu
  float_type: float64
  jitter: 1.0e-6

outputs:
  metadata_directory: data/metadata/modeling/st_svgp
  model_directory: artifacts/models/st_svgp
  metrics_directory: reports/modeling/st_svgp/metrics
  predictions_directory: reports/modeling/st_svgp/predictions
