model: st_svgp
status: promoted_candidate
experiment: free_init_1p5_trainable

dataset:
  path: data/final/yaounde_urban_expansion_30m_v2/cell_time_dataset.parquet
  target: target_transition_5y
  forecast_origin: forecast_origin
  target_year: target_year
  cell_id: cell_id
  x_coordinate: x_center_m
  y_coordinate: y_center_m

feature_set: log_distance_growth

linear_predictors:
  - ndbi_t
  - savi_t
  - log_distance_to_built_m_t
  - built_fraction_11x11_t
  - recent_local_growth_5y_t
  - elevation_m
  - slope_degrees
  - log_population_density_t
  - built_fraction_x_recent_growth_t

time:
  origin_year: 2000
  step_years: 5

rolling_validation:
  folds:
    - train_origins: [2000]
      validation_origin: 2005
    - train_origins: [2000, 2005]
      validation_origin: 2010
    - train_origins: [2000, 2005, 2010]
      validation_origin: 2015

final_fit:
  origins: [2000, 2005, 2010, 2015]

final_test:
  origins: [2020]
  evaluate: false

kernel:
  spatial_family: matern32
  temporal_family: matern32_markov
  spatial_initial_lengthscale_km: 2.0
  temporal_initial_lengthscale_steps: 1.5
  temporal_lengthscale_trainable: false
  variance: 1.0

inducing:
  spatial_points: 64
  train_locations: false
  kmeans_n_init: 10

inference:
  method: cvi_natural_gradient
  filtering: sequential
  smoothing: rts
  initial_site_precision: 1.0e-3
  natural_gradient_gamma: 0.01
  minimum_gamma: 1.0e-6
  maximum_retries: 8
  minimum_site_eigenvalue: 1.0e-9
  quadrature_degree: 20

training:
  batch_size: 1024
  iterations: 1000
  final_iterations: 1200
  adam_learning_rate: 0.001
  gradient_clip_norm: 10.0
  log_every: 50
  prediction_batch_size: 8192
  random_state: 20260809

compute:
  device: cpu
  float_type: float64
  jitter: 1.0e-6

outputs:
  metadata_directory: reports/modeling/st_svgp_improvements/five_year/temporal/temporal_lengthscale_frozen/metadata
  model_directory: reports/modeling/st_svgp_improvements/five_year/temporal/temporal_lengthscale_frozen/models
  metrics_directory: reports/modeling/st_svgp_improvements/five_year/temporal/temporal_lengthscale_frozen/metrics
  predictions_directory: reports/modeling/st_svgp_improvements/five_year/temporal/temporal_lengthscale_frozen/predictions