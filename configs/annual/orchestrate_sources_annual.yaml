version: 1

project:
  earth_engine_project: urban-sprawl-ssa

inputs:
  study_area_config: configs/study_area.yaml
  landsat_catalog_config: configs/annual/landsat_catalog_annual.yaml
  grid_specification: data/metadata/grid_specification.json
  grid_reference: tests/reference/grid_v1.json
  selected_scene_manifest: data/metadata/annual/landsat/selected_scene_manifest.csv
  compositing_protocol: data/metadata/annual/landsat/compositing_protocol.yaml
  catalog_version: data/metadata/annual/landsat/catalog_version.json

regions:
  core: data/processed/boundaries/yaounde_core.gpkg
  context: data/processed/boundaries/yaounde_context_buffer.gpkg

landsat:
  epochs:
    - 2000
    - 2001
    - 2002
    - 2003
    - 2004
    - 2005
    - 2006
    - 2007
    - 2008
    - 2009
    - 2010
    - 2011
    - 2012
    - 2013
    - 2014
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    - 2022
    - 2023
    - 2024
    - 2025
  common_bands: [blue, green, red, nir, swir1, swir2]
  optical_scale: 0.0000275
  optical_offset: -0.2
  composite_reducer: median

orchestration:
  landsat_only: true

exports:
  asset_root: projects/urban-sprawl-ssa/assets/sprawlgp/annual_v1
  landsat_folder: landsat
  overwrite_existing_assets: false
  max_pixels: 10000000
  shard_size: 256
  priority: 100
  use_frozen_transform: true
  reflectance_pyramiding_policy: mean
  count_pyramiding_policy: sample
  task_prefix: sprawlgp_annual
  task_manifest: data/metadata/annual/orchestration/earth_engine_tasks.csv

metadata:
  directory: data/metadata/annual/orchestration
  dependency_manifest: dependency_manifest.csv
  landsat_composite_manifest: landsat_composite_manifest.csv
  landsat_epoch_quality: landsat_annual_quality.csv
  day3_version: annual_orchestration_version.json

reports:
  directory: reports/annual/orchestration
  day3_report: annual_orchestration_report.md