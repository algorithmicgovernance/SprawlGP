version: 1

selection_status: PROVISIONAL_PENDING_MANUAL_VALIDATION

selected_method:
  index: ndbi
  candidate_band: built_ndbi
  validity_band: valid_ndbi

sensitivity_method:
  index: ndbsui
  candidate_band: built_ndbsui
  validity_band: valid_ndbsui

classification:
  threshold_method: epoch_specific_otsu
  threshold_source:
    data/metadata/built_up_candidates/threshold_table.csv

  morphological_filtering: none
  temporal_correction: deferred_to_day6

selection_basis:
  evidence:
    - coherent_spatial_form
    - plausible_candidate_fraction_sequence
    - stable_epoch_specific_thresholds
    - absence_of_pathological_classification

  candidate_built_fraction:
    2005: 0.264116
    2010: 0.442962
    2015: 0.505843
    2020: 0.504145
    2025: 0.623641

  thresholds:
    2005: -0.226702
    2010: -0.148432
    2015: -0.140577
    2020: -0.113236
    2025: -0.082012

rejected_methods:
  vbswir1_bi:
    reason:
      Pathological threshold and implausible candidate fractions,
      particularly in 2015 and 2020.

excluded_methods:
  ibi:
    reason:
      Unstable ratio denominator and extreme histogram values.

limitations:
  - The method has not yet been validated against expert annotations.
  - Valid Landsat spatial support differs between epochs.
  - Candidate-area changes cannot be interpreted directly as citywide growth.
  - Bare soil and mixed peri-urban cells may be confused with built surfaces.
  - No temporal persistence or minimum mapping unit has yet been applied.